# User-facing text. Values use MiniMessage formatting.
prefix: "<dark_gray>[<gradient:#f6c453:#f28c28><bold>DRAWERS</bold></gradient><dark_gray>] <reset>"

general:
  no-permission: "<red>✘ <gray>You do not have permission to do that."
  players-only: "<red>✘ <gray>Only players can use this command."
  configuration-error: "<red>✘ <gray>The drawer could not complete that action. Contact an administrator."

drawer:
  invalid: "<red>✘ <gray>Drawer unavailable: <white><reason><gray>. Contact an administrator if it persists."
  empty: "<yellow>◆ <gray>This drawer is empty."
  full: "<red>✘ <gray>This drawer is full."
  wrong-item: "<red>✘ <gray>This drawer stores a different item."
  no-matching-items: "<yellow>◆ <gray>You have no matching items to deposit."
  deposited: "<green>✔ <gray>Deposited <white><amount> <gray>item(s)."
  withdrawn: "<green>✔ <gray>Withdrew <white><amount> <gray>item(s)."
  withdrawal-pending: "<yellow>◆ <gray>Withdrawal saved; free inventory space to receive it."
  inventory-full: "<red>✘ <gray>Your inventory has no room for that item."
  interaction-face-only: "<yellow>◆ <gray>Use the front face of this drawer."
  no-barrel-inventory: "<yellow>◆ <gray>Open the drawer menu by right-clicking the drawer."
  menu-unavailable: "<red>✘ <gray>This drawer has changed. Close and reopen its menu."
  menu-too-far: "<yellow>◆ <gray>Move closer to the drawer to withdraw items."
  inventory-busy: "<yellow>◆ <gray>The drawer is completing another transfer. Try again in a moment."
  break-changed: "<yellow>◆ <gray>The drawer changed or confirmation expired. Break it again to review its current contents."
  break-unavailable: "<red>✘ <gray>Breaking stopped to protect stored items. Undelivered items remain in the drawer. Check the server log."

storage:
  title: "<dark_gray>Drawer Storage"
  previous: "<yellow>← Previous page"
  next: "<yellow>Next page →"
  first: "<gray>First page"
  last: "<gray>Last page"
  page: "<gold>Page <page> / <pages>"
  stock: "<gray>Stored: <white><amount> <dark_gray>/ <white><capacity>"
  upgrade: "<green><bold>✦ Upgrade Drawer</bold>"
  upgrade-available: "<gray>Upgrade <white><tier> <gray>to <white><next><gray>."
  upgrade-maximum: "<gold>✦ <gray>This drawer is already at the maximum tier."
  controls: "<gray>Click to pick up · Right-click to split · Shift-click to transfer"
  navigation: "<gray>Click to change page · Shift-click for first / last page"
  separator: " "

parcel:
  owner-only: "<red>✘ <gray>This contents parcel belongs to <white><owner><gray>."
  claimed: "<green>✔ <gray>Claimed <white><amount> <gray>item(s) from the contents parcel."
  inventory-full: "<red>✘ <gray>Your inventory has no room for the parcel contents."

command:
  usage: "<yellow>◆ <gray>Usage: <white>/drawers <give|reload|repair|migrate|upgrade>"
  give-usage: "<yellow>◆ <gray>Usage: <white>/drawers give <player> <tier> [amount]"
  unknown-tier: "<red>✘ <gray>Unknown drawer tier: <white><tier>"
  invalid-amount: "<red>✘ <gray>Amount must be a positive whole number."
  give-amount-limit: "<red>✘ <gray>Amount cannot exceed <white><limit><gray> drawers per command."
  player-not-found: "<red>✘ <gray>Player not found: <white><player>"
  given: "<green>✔ <gray>Gave <white><amount> <gray><tier> drawer(s) to <white><player><gray>."
  give-interrupted: "<yellow>◆ <gray>Delivery to <white><player> <gray>stopped after <white><delivered>/<amount> <gray><tier> drawer(s)."
  reloaded: "<green>✔ <gray>Configuration reloaded."
  repair-queued: "<green>✔ <gray>Queued repair for all loaded drawer chunks."
  player-only: "<red>✘ <gray>This subcommand can only be used by a player."
  migrate-no-target: "<red>✘ <gray>Look at a drawer within six blocks and try again."
  migrate-too-small: "<red>✘ <gray>Migration refused: <white><stored> <gray>items exceed the new <white><capacity> <gray>capacity."
  migrated: "<green>✔ <gray>Drawer capacity migrated from <white><old> <gray>to <white><capacity><gray>."
  migration-usage: "<yellow>◆ <gray>Use the explicit migration command configured by your administrator."
  upgrade-usage: "<yellow>◆ <gray>Usage: <white>/drawers upgrade pending [page] <gray>or <white>/drawers upgrade resolve <uuid> <committed|refunded|no-charge>"
  upgrade-ledger-unavailable: "<red>✘ <gray>The upgrade transaction ledger could not be loaded; inspect the server log."
  upgrade-page-missing: "<yellow>◆ <gray>No pending upgrades on that page."
  upgrade-pending-header: "<yellow>◆ <gray>Pending paid upgrades: <white><count> <gray>(page <white><page><gray>)."
  upgrade-pending-row: "<gray><operation> <yellow><status> <white><player> <gray><world> <white><x>,<y>,<z> <gray><from>→<to> cost <white><cost>"
  upgrade-resolution-failed: "<red>✘ <gray>Could not resolve <white><operation><gray>. Check its status and the server log."
  upgrade-resolved: "<green>✔ <gray>Recorded <white><operation> <gray>as <white><resolution><gray>."

upgrade:
  disabled: "<yellow>◆ <gray>Drawer upgrades are currently disabled."
  unavailable: "<red>✘ <gray>This drawer can no longer be upgraded. Reopen its storage menu."
  stale: "<yellow>◆ <gray>The drawer or upgrade menu changed. Reopen the storage menu."
  maximum: "<gold>✦ <gray>This drawer is already at the maximum tier."
  no-permission: "<red>✘ <gray>You do not have permission to buy this drawer upgrade."
  protected: "<red>✘ <gray>You cannot upgrade this drawer in the current protected area."
  busy: "<yellow>◆ <gray>Finish the drawer's pending transfer or recovery before upgrading it."
  pending: "<yellow>◆ <gray>This drawer has an unresolved payment operation <white><operation><gray>. Contact an administrator."
  ledger-unavailable: "<red>✘ <gray>Drawer upgrades are unavailable because the transaction ledger could not be read safely. Contact an administrator."
  economy-unavailable: "<red>✘ <gray>The economy provider is not ready. Ensure Vault and the Core economy bridge are enabled."
  insufficient-funds: "<red>✘ <gray>You need <white><cost> <gray>to buy this upgrade."
  success: "<green>✔ <gray>Upgraded the drawer from <white><tier> <gray>to <white><next> <gray>for <white><cost><gray>."
  failed: "<red>✘ <gray>The upgrade could not be saved. Contact an administrator if the drawer changed."
  ui-unavailable: "<red>✘ <gray>The upgrade menu could not be opened. Try again."
