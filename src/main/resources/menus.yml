# All storage-menu controls, Java dialogs, and Floodgate Bedrock forms.
# The schema version for this file is declared once in config.yml.

storage-menu:
  # Large chest: 45 item slots and 9 navigation slots. Only changed slots are refreshed.
  refresh-ticks: 4
  # Vanilla material or UniItems provider:id (e.g. nexo:next_page,
  # itemsadder:my_pack:next_page, mmoitems:MISCELLANEOUS:MENU_ICON).
  # Provider plugins must be installed. Missing items use the original vanilla icon
  # and log once per control until /drawers reload. Names/lore stay in messages.yml.
  items:
    previous:
      material: ARROW
    next:
      material: ARROW
    first:
      material: GRAY_STAINED_GLASS_PANE
    last:
      material: GRAY_STAINED_GLASS_PANE
    page:
      material: PAPER
    upgrade:
      material: ANVIL
    separator:
      material: BLACK_STAINED_GLASS_PANE

upgrade:
  # Same nested dialog schema style as minedream-core-smp redstone-upgrader/menu.yml.
  # Placeholders: tier, next, cost, stored, capacity, next_capacity, increase,
  # capacity_label, increase_label, upgrade_preview, world, x, y, z.
  dialogs:
    main-menu:
      dialog:
        type: "multi-action"
        title: "<gold><bold>✦ Drawer {tier}</bold>"
        external-title: "<gold>✦ Drawer {tier}"
        can-close-with-escape: true
        pause: false
        after-action: "close"
        columns: 1
        body:
          - type: "text"
            text: "<gold>━━━━━━━━━━━━━━━━━━━━</gold><br>{capacity_label}<br>{upgrade_preview}"
            width: 340
          - type: "text"
            text: "{increase_label}<br><dark_gray>{world} • {x}, {y}, {z}</dark_gray>"
            width: 340
        buttons:
          - id: "upgrade"
            enabled: true
            label: "<green><bold>✦ Upgrade to {next}</bold>"
            tooltip: "<yellow>Price <gold>{cost}</gold><br><aqua>New capacity <white>{next_capacity}</white>"
            width: 240
            action: "upgrade"
        exit-button:
          enabled: true
          id: "close"
          label: "<red>✕ Close"
          tooltip: ""
          width: 120
          action: "close"

    upgrade-confirm:
      dialog:
        type: "multi-action"
        title: "<gold><bold>✦ Confirm Drawer Upgrade</bold>"
        external-title: "<gold>✦ Confirm Drawer Upgrade"
        can-close-with-escape: true
        pause: false
        after-action: "close"
        columns: 2
        body:
          - type: "text"
            text: "<gold>━━━━━━━━━━━━━━━━━━━━</gold>"
            width: 340
          - type: "text"
            text: "<yellow>✦ Tier <white>{tier}</white> <gold>➜ <yellow>{next}</yellow><br><gold>✦ Upgrade price <yellow>{cost}</yellow>"
            width: 340
          - type: "text"
            text: "{capacity_label}<br>{increase_label}"
            width: 340
          - type: "text"
            text: "<gold>━━━━━━━━━━━━━━━━━━━━</gold><br><yellow>✦ Money is withdrawn only after confirmation.</yellow>"
            width: 340
        buttons:
          - id: "confirm"
            enabled: true
            label: "<green><bold>✓ Confirm · {cost}</bold>"
            tooltip: "<yellow>Pay <gold>{cost}</gold> and upgrade immediately."
            width: 150
            action: "confirm"
        exit-button:
          enabled: true
          id: "back"
          label: "<gray>← Back"
          tooltip: "<gray>Return to the drawer details.</gray>"
          width: 140
          action: "back"

  maximum-label: "<gold>✦ Maximum tier reached"
  upgrade-preview: "<gold>➜ {next} <dark_gray>• <yellow>{cost}"
  capacity-label: "<aqua>Capacity <white>{stored}/{capacity}</white>"
  increase-label: "<green>New capacity <white>{next_capacity}</white> <dark_gray>(+{increase})</dark_gray>"

  bedrock:
    enabled: true
    main-menu:
      title: "<gold><bold>✦ Drawer {tier}</bold>"
      content: |-
        {capacity_label}
        {upgrade_preview}
        {increase_label}
        <dark_gray>{world} • {x}, {y}, {z}</dark_gray>
      upgrade:
        label: "<green><bold>✦ Upgrade to {next}</bold>"
        description: "<yellow>Price <gold>{cost}</gold> <dark_gray>•</dark_gray> <aqua>New capacity <white>{next_capacity}</white>"
        image: {type: "path", value: "textures/ui/anvil-plus"}
      close:
        label: "<red>✕ Close"
        description: ""
        image: {type: "", value: ""}
    upgrade-confirm:
      title: "<gold><bold>✦ Confirm Drawer Upgrade</bold>"
      content: |-
        <yellow>{tier}</yellow> <gold>→</gold> <yellow>{next}</yellow>
        <gold>Price <yellow>{cost}</yellow>
        {capacity_label}
        {increase_label}
        <yellow>Money is withdrawn only after confirmation.</yellow>
      confirm:
        label: "<green><bold>✓ Confirm · {cost}</bold>"
        description: "<yellow>Pay and upgrade immediately."
        image: {type: "path", value: "textures/ui/confirm"}
      back:
        label: "<gray>← Back"
        description: "<gray>Return to the drawer details."
        image: {type: "", value: ""}

destroy:
  # Placeholders: amount, warning, world, x, y, z.
  warning: "<gray>This drawer holds <white>{amount}</white> item(s). Its contents will drop as normal item stacks, followed by the drawer block. Large amounts drop in batches.</gray>"
  empty-warning: "<gray>This drawer is empty. Confirm to destroy it and drop the drawer block.</gray>"

  dialogs:
    destroy-confirm:
      dialog:
        type: "multi-action"
        title: "<red><bold>Destroy this drawer?</bold>"
        external-title: "<red>Destroy this drawer?"
        can-close-with-escape: true
        pause: false
        after-action: "close"
        columns: 2
        body:
          - type: "text"
            text: "<red>━━━━━━━━━━━━━━━━━━━━</red><br>{warning}"
            width: 360
          - type: "text"
            text: "<dark_gray>{world} • {x}, {y}, {z}</dark_gray><br><yellow>This action rechecks the drawer before any item is dropped.</yellow>"
            width: 360
        buttons:
          - id: "confirm"
            enabled: true
            label: "<red><bold>✕ Destroy drawer</bold>"
            tooltip: "<yellow>Drop the stored items and drawer block."
            width: 170
            action: "confirm"
        exit-button:
          enabled: true
          id: "cancel"
          label: "<green>✓ Keep drawer"
          tooltip: "<gray>Close this confirmation without changing the drawer."
          width: 150
          action: "cancel"

  bedrock:
    enabled: true
    destroy-confirm:
      title: "<red><bold>Destroy this drawer?</bold>"
      content: |-
        {warning}
        <dark_gray>{world} • {x}, {y}, {z}</dark_gray>
        <yellow>This action rechecks the drawer before any item is dropped.</yellow>
      confirm:
        label: "<red><bold>✕ Destroy drawer</bold>"
        description: "<yellow>Drop the stored items and drawer block."
        image: {type: "path", value: "textures/ui/trash"}
      cancel:
        label: "<green>✓ Keep drawer"
        description: "<gray>Close without changing the drawer."
        image: {type: "", value: ""}
