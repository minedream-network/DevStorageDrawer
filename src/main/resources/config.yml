# DevStorageDrawer global settings. Strings in messages.yml use MiniMessage.
config-version: 2

# Opens from the anvil button in the storage menu. Economy is resolved through Vault;
# minedream-core-smp can publish its Core economy as the Vault provider.
upgrade:
  enabled: true
  session-seconds: 45
  maximum-distance: 8

storage-menu:
  # Large chest: 45 item slots and 9 navigation slots. Only changed slots are refreshed.
  refresh-ticks: 4
  # Vanilla material or UniItems provider:id (e.g. nexo:next_page,
  # itemsadder:my_pack:next_page, mmoitems:MISCELLANEOUS:MENU_ICON).
  # Provider plugins must be installed. Missing items use the original vanilla icon
  # and log once per control until /drawers reload. Names/lore stay in messages.yml.
  items:
    previous:
      material: ARROW
    next:
      material: ARROW
    first:
      material: GRAY_STAINED_GLASS_PANE
    last:
      material: GRAY_STAINED_GLASS_PANE
    page:
      material: PAPER
    upgrade:
      material: ANVIL
    separator:
      material: BLACK_STAINED_GLASS_PANE

interaction:
  # Controls quick withdrawals outside the storage GUI: left-click takes one item,
  # Shift+left-click takes one stack, and attacking the drawer display does the same.
  # The storage GUI, Shift+right-click deposits, upgrades, selling, breaking, and
  # Hopper/Automation are unaffected.
  shortcut-withdrawals-enabled: false
  # Controls quick deposits outside the storage GUI. When false, Shift+right-click
  # with an item does not deposit the held stack or matching inventory stacks.
  # Shift+right-click with an empty hand opens the Upgrade UI instead.
  shortcut-deposits-enabled: false
  # When quick deposits are enabled, a second matching right-click within this window
  # deposits matching inventory stacks.
  bulk-deposit-window-ticks: 10
  # false allows opening, deposits, withdrawals, and sell tools from any face.
  require-facing-face: false

visuals:
  enabled: true
  repair-on-chunk-load: true
  update-delay-ticks: 1
  # Kept slightly in front of the face to avoid client-side block occlusion/z-fighting.
  front-offset: 0.54
  item:
    enabled: true
    # The item is face-aligned with a matrix instead of entity yaw/pitch. Depth compression
    # keeps block and custom 3D models inside the drawer face.
    scale: 0.36
    depth-scale: 0.08
    offset-y: 0.02
    model-context: NONE
  text:
    enabled: true
    # Text is scaled and wrapped so its rendered width stays on the barrel face.
    scale: 0.40
    line-width: 92
    name-offset-y: 0.30
    amount-offset-y: -0.42

# Two-line holograms visible only to players identified by the backend Floodgate API.
# No Bedrock entities are created when Floodgate is unavailable.
bedrock:
  enabled: true
  required: false
  hologram:
    # Armor-stand name-row position above the drawer's base, readable from every side.
    height: 1.35
    line-spacing: 0.25
  armor-stand:
    # Optional helmet item; Java custom models need a matching Bedrock resource pack.
    show-item: false
    show-name: true
    marker: true
    invisible: true

automation:
  enabled: true
  # Maximum batch considered by the eventless block-hopper input guard. Zero auto-detects
  # world-settings.*.hopper-amount from spigot.yml. Set this explicitly when the server uses a
  # custom --spigot-settings path or an eventless custom hopper implementation.
  hopper-transfer-amount: 0
  # Optional per-world overrides, keyed by the exact Bukkit world name.
  hopper-transfer-amount-overrides: {}
  # Emits every hopper decision and reconciliation step. Enable temporarily while diagnosing automation.
  debug-logging: false
  # Detects hopper implementations that bypass InventoryMoveItemEvent without scanning unloaded chunks.
  fallback-poll-interval-ticks: 10
  # Slot zero is the input buffer except when a completely full drawer needs all 27
  # real slots to make vanilla emit comparator level 15.
  output-proxy-slots: 26
  # The plugin additionally waits one tick after a move event so it reads the completed vanilla transfer.
  rebalance-delay-ticks: 1
  journal:
    recover-on-load: true

redstone:
  # Requires automation.enabled, exactly 26 output proxy slots, and tiers >= 27 stacks.
  logical-comparator-output: true
  comparator-recalculate-delay-ticks: 1
  protect-from-explosions: true
  prevent-piston-movement: true

destroy:
  # Filled drawers drop real items in native stacks. The barrel remains until all batches finish.
  # Each completed batch saves its remaining stock; hopper/player transfers pause during destruction.
  stacks-per-tick: 16
